<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Téléchargez ATEQO – Optimisez vos tournées | Google Play</title>
  <meta name="description" content="ATEQO optimise tes tournées de livraison en quelques secondes. Moins de kilomètres, plus de livraisons. Télécharge gratuitement sur Google Play." />
  <link rel="canonical" href="https://ateqo.fr/download/" />
  <meta name="theme-color" content="#f1f4f7" />

  <!-- Secours sans JS (navigateurs in-app TikTok/Instagram restreints, bloqueurs).
       Delai volontairement plus long que le minuteur JavaScript de 3 s, et non
       egal : a delai egal le meta refresh gagnait systematiquement la course,
       puisqu'il est arme des l'analyse du <head> alors que le minuteur ne demarre
       qu'apres le script en bas de page. Le depart passait donc a cote de la
       mesure (trackAutoRedirect n'etait jamais atteint), et surtout il ejectait le
       visiteur vers Google Play pendant qu'il lisait la banniere cookies, que seul
       le chemin JavaScript sait mettre en pause. -->
  <meta http-equiv="refresh" content="12;url=https://play.google.com/store/apps/details?id=com.lkqmlr.cargo" />

  <!-- Favicon -->
  <link rel="icon" href="../img/logo_ateqo.png" />
  <link rel="apple-touch-icon" href="../img/logo_ateqo.png" />

  <!-- Open Graph / partage sur les réseaux sociaux -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ATEQO" />
  <meta property="og:title" content="Téléchargez ATEQO · L'itinéraire qui te suit" />
  <meta property="og:description" content="Optimise tes tournées en quelques secondes. Gagne du temps, réduis tes kilomètres, livre plus." />
  <meta property="og:url" content="https://ateqo.fr/download/" />
  <meta property="og:image" content="https://ateqo.fr/img/banner.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Téléchargez ATEQO · L'itinéraire qui te suit" />
  <meta name="twitter:description" content="Optimise tes tournées en quelques secondes. Gagne du temps, réduis tes kilomètres, livre plus." />
  <meta name="twitter:image" content="https://ateqo.fr/img/banner.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f1f4f7;--surface:#ffffff;
      --ink:#17356B;--muted:#5b6b7e;--muted2:#8896a7;
      --accent:#2563eb;--green:#16a34a;
      --border:rgba(15,25,35,.09);
      --radius:16px;
    }
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--ink);
      min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;-webkit-font-smoothing:antialiased;line-height:1.5;
    }
    .card{
      width:100%;max-width:420px;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:0 18px 50px rgba(15,25,35,.12);
      padding:40px 32px;text-align:center;
    }
    .logo{width:76px;height:76px;margin:0 auto 22px;display:block;filter:drop-shadow(0 4px 10px rgba(15,25,35,.14))}
    h1{font-size:1.6rem;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
    .pitch{font-size:.95rem;color:var(--muted);line-height:1.6;margin-bottom:28px}
    .pitch strong{color:var(--ink);font-weight:600}

    .store-badges{display:flex;flex-direction:column;gap:10px;align-items:center}
    .btn-play{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:15px 20px;border-radius:12px;
      background:var(--ink);color:#fff;font-weight:700;font-size:.98rem;
      text-decoration:none;box-shadow:0 8px 22px rgba(23,53,107,.28);
      transition:transform .2s,box-shadow .2s;
    }
    .btn-play:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(23,53,107,.34)}
    .btn-play svg{flex-shrink:0}

    .redirect-note{margin-top:16px;font-size:.78rem;color:var(--muted2)}

    .badges{margin-top:22px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
    .badges span{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

    .back-home{display:inline-block;margin-top:26px;font-size:.8rem;color:var(--muted);text-decoration:none;font-weight:600}
    .back-home:hover{color:var(--accent)}

    footer{margin-top:22px;text-align:center}
    footer .flinks{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    footer .flinks a{font-size:.76rem;color:var(--muted2);font-weight:600;text-decoration:none}
    footer .flinks a:hover{color:var(--accent)}
  </style>

  <!-- ── Mesure d'audience (GA4) ───────────────────────────────────────────────
       Meme module que l'accueil : rien n'est depose avant le consentement. Sur
       cette page, la banniere suspend en plus la redirection automatique (cf. le
       script en bas de page). -->
  <script src="/assets/analytics.js?v=4" defer></script>
</head>
<body>
  <main class="card">
    <img class="logo" src="../img/logo_ateqo.png" alt="ATEQO" />
    <h1>Téléchargez ATEQO</h1>
    <p class="pitch">ATEQO <strong>optimise</strong> tes tournées de livraison en quelques secondes. Moins de kilomètres, plus de livraisons.</p>

    <div class="store-badges">
      <!-- Emplacement prévu : ajouter ici un second .btn-play pour l'App Store iOS quand disponible -->
      <a class="btn-play" id="play-cta" href="https://play.google.com/store/apps/details?id=com.lkqmlr.cargo" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
        Télécharger sur Google Play
      </a>
    </div>

    <p class="redirect-note" id="redirect-note">Redirection automatique vers Google Play dans 3 secondes…</p>

    <div class="badges">
      <span><span class="dot"></span> Gratuit</span>
      <span><span class="dot"></span> Android</span>
    </div>

    <a class="back-home" href="/">← Retour au site ATEQO</a>
  </main>

  <!-- Emplacements prévus pour une prochaine évolution : section FAQ, vidéo de démonstration, liens réseaux sociaux -->
  <footer>
    <div class="flinks">
      <a href="/policy/">Confidentialité</a>
      <a href="/policy/terms.html">Conditions</a>
      <a href="mailto:cargo.app.admin@gmail.com">Contact</a>
      <!-- Retrait du consentement : obligation RGPD. Masque par defaut et revele
           par assets/analytics.js seulement si une mesure est reellement active. -->
      <a href="#" data-consent-open hidden>Cookies</a>
    </div>
  </footer>

  <script>
    (function () {
      var GOOGLE_PLAY_URL = 'https://play.google.com/store/apps/details?id=com.lkqmlr.cargo';
      var REDIRECT_DELAY_MS = 3000;

      var NOTE_COUNTDOWN = 'Redirection automatique vers Google Play dans 3 secondes…';
      var NOTE_WAITING_FOR_CONSENT = 'Redirection en pause le temps de votre choix sur les cookies. Le bouton ci-dessus reste disponible.';

      var redirectNote = document.getElementById('redirect-note');
      var pendingRedirect = null;

      function goToGooglePlay() {
        // Le depart automatique n'est pas un clic : c'est au module de mesure de
        // le compter, et seulement s'il est charge et accepte.
        if (window.ateqoConsent && typeof window.ateqoConsent.trackAutoRedirect === 'function') {
          window.ateqoConsent.trackAutoRedirect();
        }
        window.location.href = GOOGLE_PLAY_URL;
      }

      function startRedirectCountdown() {
        if (pendingRedirect) return;
        if (redirectNote) redirectNote.textContent = NOTE_COUNTDOWN;
        pendingRedirect = setTimeout(goToGooglePlay, REDIRECT_DELAY_MS);
      }

      function suspendRedirectCountdownUntilConsent() {
        if (pendingRedirect) {
          clearTimeout(pendingRedirect);
          pendingRedirect = null;
        }
        if (redirectNote) redirectNote.textContent = NOTE_WAITING_FOR_CONSENT;
      }

      // Partir vers Google Play pendant que la banniere de consentement est
      // affichee ne laisserait pas le temps d'y repondre. On suspend donc le
      // compte a rebours, et on le relance une fois le choix fait : ce delai
      // laisse aussi a la balise le temps d'envoyer la vue de page.
      // Sans module de mesure (identifiants vides, bloqueur de publicite), aucun
      // evenement n'arrive et le minuteur lance ci-dessous s'applique tel quel.
      document.addEventListener('ateqo:consent', function (consentEvent) {
        var state = consentEvent.detail && consentEvent.detail.state;
        if (state === 'pending') suspendRedirectCountdownUntilConsent();
        else startRedirectCountdown();
      });

      startRedirectCountdown();
    })();
  </script>
</body>
</html>
